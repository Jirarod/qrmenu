version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: qrmenu-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: qrmenu
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - qrmenu-dev-network
    restart: unless-stopped

  # Go Backend API (Development with hot reload)
  backend-dev:
    build:
      context: ./qrmenu-be
      dockerfile: Dockerfile.dev
    container_name: qrmenu-backend-dev
    environment:
      PORT: 8080
      ENVIRONMENT: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: qrmenu
      DB_SSLMODE: disable
      JWT_SECRET: your_jwt_secret_key_here
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - qrmenu-dev-network
    volumes:
      - ./qrmenu-be:/app
    restart: unless-stopped

  # React Frontend (Development with hot reload)
  frontend-dev:
    build:
      context: ./qrmenu-fe
      dockerfile: Dockerfile.dev
    container_name: qrmenu-frontend-dev
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: true
    ports:
      - "3000:3000"
    depends_on:
      - backend-dev
    networks:
      - qrmenu-dev-network
    volumes:
      - ./qrmenu-fe:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local

networks:
  qrmenu-dev-network:
    driver: bridge